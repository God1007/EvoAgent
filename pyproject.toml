[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "evoagent-pr-review"
dynamic = ["version"]
description = "A verifier-driven, continuously evolving multi-agent code review service."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "God1007" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "psycopg[binary]>=3.1,<4",
  "psycopg-pool>=3.2,<4",
  "redis>=5,<7",
  "PyJWT[crypto]>=2.8,<3",
  "langgraph>=0.2,<2",
  "opentelemetry-sdk>=1.24,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.24,<2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "mypy>=1.15,<3",
  "pip>=24,<26",
  "pip-audit>=2.7,<3",
  "pip-tools>=7.4,<8",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.11,<0.17",
]

[project.scripts]
evoagent = "evoagent.api:run"
evoagent-migrate = "evoagent.migrate:run"

[project.urls]
Homepage = "https://github.com/God1007/EvoAgent"
Issues = "https://github.com/God1007/EvoAgent/issues"

[tool.setuptools.dynamic]
version = { attr = "evoagent.__version__" }

[tool.setuptools.packages.find]
include = ["evoagent*"]

[tool.setuptools.package-data]
evoagent = ["py.typed"]

[tool.setuptools.data-files]
"share/evoagent/web" = ["web/*.css", "web/*.html", "web/*.js"]
"share/evoagent/skills/code-quality" = [
  "skills/code-quality/SKILL.md",
  "skills/code-quality/skill.json",
  "skills/code-quality/skill.py",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["evoagent"]
omit = [
  "evoagent/__main__.py",
  "evoagent/api.py",
  "evoagent/postgres_store.py",
  "evoagent/skill_runner.py",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["assets", "log", "output"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF100", "UP"]
ignore = ["UP031", "UP042"]

[tool.ruff.lint.per-file-ignores]
"evoagent/skill_runner.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["evoagent"]
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = true
show_error_codes = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true

