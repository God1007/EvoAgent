# Version 2 adds weighted active routes and isolated candidate shadows.
# API keys remain environment references; never put secret values in this file.
version = 2

[[routes]]
id = "eu-stable-a"
state = "active"
priority = 10
weight = 3
provider = "provider-a"
model = "model-a"
base_url = "https://eu-a.example/v1"
api_key_env = "PROVIDER_A_API_KEY"
region = "eu-west"
tenant_ids = ["acme"]
repository_patterns = ["acme/*"]
input_cost_micros_per_million = 250000
output_cost_micros_per_million = 1000000

[[routes]]
id = "eu-stable-b"
state = "active"
priority = 10
weight = 1
provider = "provider-b"
model = "model-b"
base_url = "https://eu-b.example/v1"
api_key_env = "PROVIDER_B_API_KEY"
region = "eu-west"
tenant_ids = ["acme"]
repository_patterns = ["acme/*"]
input_cost_micros_per_million = 300000
output_cost_micros_per_million = 1200000

[[routes]]
id = "eu-candidate"
state = "candidate"
provider = "provider-c"
model = "model-c"
base_url = "https://eu-c.example/v1"
api_key_env = "PROVIDER_C_API_KEY"
region = "eu-west"
tenant_ids = ["acme"]
repository_patterns = ["acme/*"]
baseline_route_id = "eu-stable-a"
shadow_percent = 10
min_shadow_samples = 100
max_shadow_error_rate = 0.03
max_shadow_disagreement_rate = 0.15
# Replace these example digests with immutable references generated by the
# approved offline evaluation pipeline before requesting promotion.
evaluation_dataset_sha256 = "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
evaluation_report_sha256 = "bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
input_cost_micros_per_million = 250000
output_cost_micros_per_million = 1000000
