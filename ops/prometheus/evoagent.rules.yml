groups:
  - name: evoagent-slo-recording
    interval: 30s
    rules:
      - record: evoagent:sli:http_availability_5m
        expr: 1 - ((sum(rate(evoagent_http_nonprobe_responses_5xx_total[5m])) or vector(0)) / clamp_min((sum(rate(evoagent_http_nonprobe_requests_total[5m])) or vector(0)), 0.000001))
      - record: evoagent:sli:intake_p99_seconds_10m
        expr: histogram_quantile(0.99, sum by (le) (rate(evoagent_http_request_intake_bucket[10m])))
      - record: evoagent:sli:review_success_30m
        expr: (sum(increase(evoagent_reviews_total[30m])) or vector(0)) / clamp_min((sum(increase(evoagent_reviews_total[30m])) or vector(0)) + (sum(increase(evoagent_reviews_failed_total[30m])) or vector(0)), 1)
      - record: evoagent:ratio:repair_verification_blocked_6h
        expr: (sum(increase(evoagent_fix_verification_blocked_total[6h])) or vector(0)) / clamp_min((sum(increase(evoagent_fix_attempts_total[6h])) or vector(0)), 1)
      - record: evoagent:ratio:negative_feedback_24h
        expr: ((sum(increase(evoagent_feedback_false_positive_total[24h])) or vector(0)) + (sum(increase(evoagent_feedback_missed_issue_total[24h])) or vector(0)) + (sum(increase(evoagent_feedback_bad_fix_total[24h])) or vector(0))) / clamp_min((sum(increase(evoagent_feedback_total[24h])) or vector(0)), 1)
      - record: evoagent:ratio:tenant_review_capacity_rejected_15m
        expr: (sum(increase(evoagent_review_admission_rejections_total[15m])) or vector(0)) / clamp_min((sum(increase(evoagent_review_admissions_total[15m])) or vector(0)) + (sum(increase(evoagent_review_admission_rejections_total[15m])) or vector(0)), 1)
      - record: evoagent:ratio:skill_failure_15m
        expr: (sum(increase(evoagent_skill_failures_total[15m])) or vector(0)) / clamp_min((sum(increase(evoagent_skill_runs_total[15m])) or vector(0)), 1)

  - name: evoagent-slo-alerts
    rules:
      - alert: EvoAgentMonitoringTargetDown
        expr: absent(up{job="evoagent"}) or max(up{job="evoagent"}) == 0
        for: 2m
        labels: {severity: page}
        annotations:
          summary: Prometheus cannot scrape any EvoAgent instance
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#monitoring-target-down
      - alert: EvoAgentAvailabilityFastBurn
        expr: ((sum(rate(evoagent_http_nonprobe_responses_5xx_total[5m])) or vector(0)) / clamp_min((sum(rate(evoagent_http_nonprobe_requests_total[5m])) or vector(0)), 0.000001) > 0.0144) and ((sum(rate(evoagent_http_nonprobe_responses_5xx_total[1h])) or vector(0)) / clamp_min((sum(rate(evoagent_http_nonprobe_requests_total[1h])) or vector(0)), 0.000001) > 0.0144) and sum(increase(evoagent_http_nonprobe_requests_total[5m])) > 20
        for: 2m
        labels: {severity: page}
        annotations:
          summary: EvoAgent is rapidly consuming its availability budget
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#availability-fast-burn
      - alert: EvoAgentAvailabilitySlowBurn
        expr: ((sum(rate(evoagent_http_nonprobe_responses_5xx_total[30m])) or vector(0)) / clamp_min((sum(rate(evoagent_http_nonprobe_requests_total[30m])) or vector(0)), 0.000001) > 0.006) and ((sum(rate(evoagent_http_nonprobe_responses_5xx_total[6h])) or vector(0)) / clamp_min((sum(rate(evoagent_http_nonprobe_requests_total[6h])) or vector(0)), 0.000001) > 0.006) and sum(increase(evoagent_http_nonprobe_requests_total[30m])) > 100
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: EvoAgent is steadily consuming its availability budget
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#availability-slow-burn
      - alert: EvoAgentIntakeLatencyHigh
        expr: evoagent:sli:intake_p99_seconds_10m > 0.5 and sum(increase(evoagent_http_request_intake_count[10m])) > 20
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Async intake p99 is above 500 ms
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#intake-latency
      - alert: EvoAgentQueueStale
        expr: evoagent_queue_oldest_age_seconds > 60
        for: 5m
        labels: {severity: page}
        annotations:
          summary: The oldest review queue item is over 60 seconds old
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentQueueUnhealthy
        expr: evoagent_queue_healthy < 1
        for: 2m
        labels: {severity: page}
        annotations:
          summary: The review queue dependency or one of its workers is unhealthy
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentQueueLeaseHeartbeatFailing
        expr: sum(increase(evoagent_queue_lease_heartbeat_failures_total[10m])) > 2
        for: 2m
        labels: {severity: page}
        annotations:
          summary: Active Redis deliveries are not renewing their lease
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentMetricGaugeCollectionFailing
        expr: sum(rate(evoagent_metrics_gauge_scrape_failures_total[5m])) > 0.01
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: EvoAgent is omitting one or more dynamic gauges during scrapes
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#metric-collection
      - alert: EvoAgentOutboxStale
        expr: evoagent_outbox_oldest_age_seconds > 30
        for: 5m
        labels: {severity: page}
        annotations:
          summary: A committed review has not reached the queue
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentOutboxDispatcherStopped
        expr: evoagent_outbox_dispatcher_running < 1
        for: 2m
        labels: {severity: page}
        annotations:
          summary: The local transactional Outbox dispatcher has stopped
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentOutboxLeaseConflicts
        expr: (sum(increase(evoagent_outbox_lease_conflicts_total[10m])) or vector(0)) > 2
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: Outbox workers are repeatedly losing publication leases
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentEffectLeaseConflicts
        expr: (sum(increase(evoagent_effect_lease_conflicts_total[10m])) or vector(0)) > 2
        for: 2m
        labels: {severity: ticket}
        annotations:
          summary: Comment or repair workers are repeatedly losing effect ownership
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#queue-or-outbox-stale
      - alert: EvoAgentDeadLettersPresent
        expr: evoagent_dead_letter_depth > 0 or evoagent_outbox_dead > 0
        for: 1m
        labels: {severity: ticket}
        annotations:
          summary: Durable work requires operator remediation
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#dead-letters
      - alert: EvoAgentDeadLetterDecodeFailing
        expr: (sum(increase(evoagent_queue_dead_letter_decode_failures_total[15m])) or vector(0)) > 0
        for: 1m
        labels: {severity: ticket}
        annotations:
          summary: One or more Redis dead-letter records are unreadable
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#dead-letters
      - alert: EvoAgentReviewFailureRateHigh
        expr: (1 - evoagent:sli:review_success_30m) > 0.01 and ((sum(increase(evoagent_reviews_total[30m])) or vector(0)) + (sum(increase(evoagent_reviews_failed_total[30m])) or vector(0))) > 20
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Review terminal failure rate is above 1%
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentReviewAgentBudgetTimeouts
        expr: (sum(increase(evoagent_review_agent_budget_timeouts_total[15m])) or vector(0)) > 2
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Reviewer pools are repeatedly exceeding their task budget
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentFailureCasePersistenceFailing
        expr: sum(increase(evoagent_failure_case_persistence_failures_total[15m])) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Failed reviews are not reaching the learning corpus
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentAlertEvaluationFailing
        expr: (sum(increase(evoagent_alert_evaluation_failures_total[15m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Tenant failure-rate notifications are not refreshing
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentReleaseObservationFailing
        expr: (sum(increase(evoagent_release_observation_failures_total[15m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Terminal review outcomes are not reaching rollout governance
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentShadowAuditFailing
        expr: (sum(increase(evoagent_shadow_audit_failures_total[15m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: A shadow failure could not be recorded in the operator audit
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#model-rollout
      - alert: EvoAgentReleaseAlertFailing
        expr: (sum(increase(evoagent_release_alert_failures_total[15m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: Durable rollout changes are not reaching operator notifications
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#model-rollout
      - alert: EvoAgentReleaseRevisionMismatch
        expr: (sum(increase(evoagent_release_revision_mismatch_total[15m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: A running candidate was evaluated under a different runtime revision
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#model-rollout
      - alert: EvoAgentReviewTerminalAccountingFailing
        expr: (sum(increase(evoagent_review_terminal_accounting_failures_total[15m])) or vector(0)) > 0
        for: 5m
        labels: {severity: ticket}
        annotations:
          summary: A synchronous review exception has no matching durable terminal state
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentSkillFailureRateHigh
        expr: evoagent:ratio:skill_failure_15m > 0.05 and sum(increase(evoagent_skill_runs_total[15m])) > 20
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Dynamic Skill failure rate is above 5%
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentSkillContainerCleanupFailing
        expr: (sum(increase(evoagent_skill_container_cleanup_failures_total[15m])) or vector(0)) > 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: A dynamic Skill container could not be removed
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentRepairContainerCleanupFailing
        expr: (sum(increase(evoagent_repair_container_cleanup_failures_total[15m])) or vector(0)) > 0
        for: 1m
        labels: {severity: page}
        annotations:
          summary: A repair verification container could not be removed
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#review-failures
      - alert: EvoAgentRepairVerificationBlockedHigh
        expr: evoagent:ratio:repair_verification_blocked_6h > 0.2 and sum(increase(evoagent_fix_attempts_total[6h])) > 10
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: Repair verification is blocking more than 20% of attempts
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#repair-outcomes
      - alert: EvoAgentNegativeFeedbackHigh
        expr: evoagent:ratio:negative_feedback_24h > 0.2 and sum(increase(evoagent_feedback_total[24h])) > 20
        for: 30m
        labels: {severity: ticket}
        annotations:
          summary: Negative operator feedback exceeds 20%
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#quality-feedback
      - alert: EvoAgentRetentionMaintenanceStalled
        expr: evoagent_retention_enabled > 0 and (time() - evoagent_retention_last_success_timestamp_seconds) > clamp_min(2 * evoagent_retention_maintenance_interval_seconds, 600)
        for: 15m
        labels: {severity: ticket}
        annotations:
          summary: Operational-history retention has stalled
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#history-retention
      - alert: EvoAgentTenantReviewCapacitySaturated
        expr: evoagent:ratio:tenant_review_capacity_rejected_15m > 0.1 and sum(increase(evoagent_review_admission_rejections_total[15m])) > 5
        for: 10m
        labels: {severity: ticket}
        annotations:
          summary: Tenant review admission is rejecting sustained traffic
          runbook_url: https://github.com/God1007/EvoAgent/blob/main/docs/operations.md#tenant-review-capacity
