version: 2
# NOTE: dependabot updates pyproject.toml ranges but cannot regenerate the
# hash-pinned requirements.lock / requirements-dev.lock (the files CI and Docker
# actually install with --require-hashes). After merging a pip bump, run
# `make lock` to refresh the locks. tests/test_dependencies.py fails if a bumped
# pyproject bound no longer matches the pinned lock version.
# Workflow Actions are pinned to full commits; keep their trailing version
# comments so Dependabot can update the SHA without hiding the release line.
# Docker and Compose images keep a readable tag plus an immutable digest; the
# Docker updater refreshes those digests instead of making rebuilds mutable.
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

