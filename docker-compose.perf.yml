# Full-stack performance rig: multi-worker app + Postgres (pooled) + Redis queue.
# Auth is disabled here ON PURPOSE for load generation - do NOT use this file to
# deploy. Run with: docker compose -f docker-compose.perf.yml up --build
#
#   k6 (host):        k6 run perf/k6/steady.js
#   pure-python:      python scripts/loadgen.py --base-url http://127.0.0.1:8080 ...
#   k6 (containered): docker compose -f docker-compose.perf.yml run --rm k6 run /perf/steady.js
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: evoagent
      POSTGRES_USER: evoagent
      POSTGRES_PASSWORD: evoagent-local
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evoagent"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  evoagent:
    build: .
    ports:
      - "8080:8080"
    environment:
      EVOAGENT_HOST: 0.0.0.0
      EVOAGENT_DATABASE_URL: postgresql://evoagent:evoagent-local@postgres:5432/evoagent
      EVOAGENT_REDIS_URL: redis://redis:6379/0
      EVOAGENT_WEB_WORKERS: ${EVOAGENT_WEB_WORKERS:-4}
      EVOAGENT_ASYNC_WORKERS: ${EVOAGENT_ASYNC_WORKERS:-8}
      EVOAGENT_PG_POOL_MAX: ${EVOAGENT_PG_POOL_MAX:-10}
      EVOAGENT_RATE_LIMIT_RPS: ${EVOAGENT_RATE_LIMIT_RPS:-0}
      EVOAGENT_MAX_INFLIGHT_HEAVY: ${EVOAGENT_MAX_INFLIGHT_HEAVY:-0}
      EVOAGENT_SHUTDOWN_GRACE_SECONDS: ${EVOAGENT_SHUTDOWN_GRACE_SECONDS:-2}
      EVOAGENT_SKILLS_DIR: /app/skills
      EVOAGENT_AUTH_REQUIRED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    init: true
    tmpfs:
      - /tmp:size=256m,mode=1777

  # Optional in-cluster k6 runner (profile: k6). Scripts are mounted read-only.
  k6:
    image: grafana/k6:latest
    profiles: ["k6"]
    environment:
      BASE_URL: http://evoagent:8080
    volumes:
      - ./perf/k6:/perf:ro
    depends_on:
      - evoagent
