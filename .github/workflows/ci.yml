name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVOAGENT_TEST_POSTGRES_URL: postgresql://evoagent:evoagent-ci@127.0.0.1:5432/evoagent
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: evoagent
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: evoagent-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
          bash -n scripts/deploy.sh
      - name: Type check
        run: python -m mypy
      - name: Web regression checks
        run: |
          node --check web/app.js
          node --test tests/web.test.cjs
      - name: Validate Prometheus recording and alert rules
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/ops/prometheus:/rules:ro" \
            prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996 \
            check rules /rules/evoagent.rules.yml
      - name: Test with coverage gate
        run: python -m pytest --cov=evoagent --cov-report=term-missing --cov-report=xml
      - name: Reproduce controlled evaluation evidence
        run: |
          python scripts/run_e2e_evaluation.py --reuse-dataset
          python - <<'PY'
          import hashlib
          import json
          import platform

          from evoagent import __version__
          from evoagent.review_engine import _APPLICATION_SOURCE_REVISION

          with open("output/evaluation/evaluation-report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          with open("requirements.lock", "rb") as handle:
              lock_sha256 = hashlib.sha256(handle.read()).hexdigest()
          with open("docs/evaluation-baseline.md", encoding="utf-8") as handle:
              baseline_document = handle.read()
          candidate = report["candidate"]
          release = report["comparison"]["release_gate"]
          reproducibility = report["reproducibility"]
          failures = {name for name, gate in release["gates"].items() if not gate["passed"]}
          assert report["schema_version"] == 3
          assert candidate["schema_version"] == 2
          assert candidate["dataset"]["sha256"] == "8d2271ec666dcbc96b0c8a13e05adcf71c08f33bf17da5d1c102fe9a3434af38"
          assert reproducibility == {
              "application_source_sha256": _APPLICATION_SOURCE_REVISION,
              "evoagent_version": __version__,
              "python_version": platform.python_version(),
              "requirements_lock_sha256": lock_sha256,
          }
          assert all(str(value) in baseline_document for value in reproducibility.values())
          assert candidate["dataset"]["sha256"] in baseline_document
          assert "| Evaluation report schema | 3 |" in baseline_document
          assert candidate["metrics"]["safe_fix_rate"] == 1.0
          assert candidate["metrics"]["e2e_security_fix_rate"] == 0.35
          assert failures == {"e2e_security_fix_rate", "production_data_provenance"}
          assert not release["quantitative_passed"]
          assert not release["production_activation_allowed"]
          assert candidate["confidence_calibration"]["invalid_confidences"] == 0
          PY
      - name: Retain synthetic evaluation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-evaluation-evidence
          path: output/evaluation/evaluation-report.*
          if-no-files-found: warn
          retention-days: 14
      - name: Build distributions
        run: python -m build
      - name: Generate and audit the runtime dependency SBOM
        run: |
          python -m pip_audit -r requirements.lock --require-hashes --disable-pip \
            --format cyclonedx-json --output evoagent-runtime.cdx.json \
            --progress-spinner off
          python -c "import json; d=json.load(open('evoagent-runtime.cdx.json')); c={x['name'].lower() for x in d.get('components',[])}; assert d['bomFormat']=='CycloneDX' and {'psycopg','redis','pyjwt'} <= c"
      - name: Retain the runtime dependency SBOM
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-dependency-sbom
          path: evoagent-runtime.cdx.json
          if-no-files-found: error
          retention-days: 30
      - name: Smoke-test the installed wheel and packaged resources
        run: |
          wheel_env="${RUNNER_TEMP}/evoagent-wheel"
          python -m venv --system-site-packages "$wheel_env"
          "$wheel_env/bin/python" -m pip install --no-deps --force-reinstall dist/*.whl
          cd "$RUNNER_TEMP"
          EVOAGENT_DATABASE_URL="${EVOAGENT_TEST_POSTGRES_URL}" \
            "$wheel_env/bin/evoagent-migrate" | "$wheel_env/bin/python" -c \
            "import json,sys; from evoagent.migrations import CURRENT_SCHEMA_VERSION; d=json.load(sys.stdin); assert d['schema_version'] == CURRENT_SCHEMA_VERSION"
          EVOAGENT_HOST=127.0.0.1 EVOAGENT_PORT=18081 \
            EVOAGENT_DATABASE_URL="${EVOAGENT_TEST_POSTGRES_URL}" \
            "$wheel_env/bin/evoagent" > wheel-smoke.log 2>&1 &
          wheel_pid=$!
          trap 'kill "$wheel_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18081/ready >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat wheel-smoke.log
              exit 1
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18081/ | grep -q '<!doctype html>'
          test -f "$wheel_env/share/evoagent/skills/code-quality/SKILL.md"
          test -f "$wheel_env/share/evoagent/ops/slo.toml"
          test -f "$wheel_env/share/evoagent/ops/prometheus/evoagent.rules.yml"
          test -f "$wheel_env/share/evoagent/ops/grafana/evoagent-overview.json"
          "$wheel_env/bin/evoagent-slo" --help >/dev/null
          "$wheel_env/bin/evoagent-dr" --help >/dev/null
          "$wheel_env/bin/evoagent-recover-queue" --help >/dev/null
          "$wheel_env/bin/evoagent-eval-labels" --help >/dev/null
          "$wheel_env/bin/python" -c "from evoagent.review_extensions import ReviewerContribution"
          "$wheel_env/bin/python" -I - "$GITHUB_WORKSPACE/dist" <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import sysconfig
          import tarfile

          import evoagent
          from evoagent.review_engine import _APPLICATION_SOURCE_REVISION, _source_revision

          assert Path(evoagent.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          source = Path(os.environ["GITHUB_WORKSPACE"]) / "examples"
          assert _APPLICATION_SOURCE_REVISION == _source_revision(source.parent / "evoagent")
          installed = Path(sysconfig.get_path("data")) / "share/evoagent/examples"
          with tarfile.open(next(Path(sys.argv[1]).glob("*.tar.gz"))) as archive:
              prefix = archive.getnames()[0].split("/")[0]
              for name in ("custom_review_workflow.py", "business-review.json"):
                  expected = (source / name).read_bytes()
                  assert (installed / name).read_bytes() == expected
                  assert archive.extractfile(f"{prefix}/examples/{name}").read() == expected
          command = [
              sys.executable, "-I", str(installed / "custom_review_workflow.py"),
              "--workflow", str(installed / "business-review.json"),
          ]
          checked = json.loads(subprocess.check_output([*command, "--check"], timeout=15))
          executed = json.loads(subprocess.check_output(command, timeout=15))
          assert checked["valid"] is True
          assert checked["revision"] == executed["revision"]
          assert len(executed["workflow"]["steps"]) == 8
          assert executed["findings"][0]["rule_id"] == "SEC-EVAL"
          print("Installed workflow: eight stages, matching revision and verified example finding")
          PY
          kill -TERM "$wheel_pid"
          wait "$wheel_pid"
          trap - EXIT

  compatibility:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EVOAGENT_TEST_POSTGRES_URL: postgresql://evoagent:evoagent-ci@127.0.0.1:5432/evoagent
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: evoagent
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: evoagent-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Run test suite
        run: python -m pytest -q

  external-integration:
    name: PostgreSQL + Redis + container contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVOAGENT_TEST_POSTGRES_URL: postgresql://evoagent:evoagent-ci@127.0.0.1:5432/evoagent
      EVOAGENT_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_DB: evoagent
          POSTGRES_USER: evoagent
          POSTGRES_PASSWORD: evoagent-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U evoagent -d evoagent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Install PostgreSQL backup and restore tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          pg_dump --version
          pg_restore --version
      - name: Run the real migration entry point
        env:
          EVOAGENT_DATABASE_URL: ${{ env.EVOAGENT_TEST_POSTGRES_URL }}
        run: |
          python -m evoagent.migrate | tee migration.json
          python -c "import json; from evoagent.migrations import CURRENT_SCHEMA_VERSION; d=json.load(open('migration.json')); assert d == {'backend':'postgresql','schema_version':CURRENT_SCHEMA_VERSION,'status':'migrated'}"
      - name: Run adapter contracts and restart fault tests
        run: |
          python -m pytest -q \
            tests/test_adapter_contracts.py \
            tests/test_external_integrations.py \
            tests/test_github_http_fixture.py \
            tests/test_workflow.py \
            tests/test_workflow_delivery.py \
            tests/test_dr.py \
            --cov=evoagent.postgres_store \
            --cov-config=/dev/null \
            --cov-report=term-missing \
            --cov-report=xml:postgres-coverage.xml \
            --cov-fail-under=0 \
            --junitxml=external-contracts.xml
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('external-contracts.xml').getroot(); n=sum(int(x.attrib.get('skipped',0)) for x in r.iter('testsuite')); assert n == 0, f'{n} external contracts were skipped'"
      - name: Retain infrastructure contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infrastructure-contract-evidence
          path: |
            external-contracts.xml
            postgres-coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Prove backup and isolated restore integrity
        env:
          EVOAGENT_DATABASE_URL: ${{ env.EVOAGENT_TEST_POSTGRES_URL }}
        run: |
          mkdir -p "${RUNNER_TEMP}/evoagent-dr"
          python -m evoagent.dr \
            --output-dir "${RUNNER_TEMP}/evoagent-dr" \
            --max-rpo-seconds 300 \
            --max-rto-seconds 300 > recovery-report.json
          cat recovery-report.json
          python -c "import json; d=json.load(open('recovery-report.json')); assert d['status']=='pass'; assert d['integrity']['source_fingerprint']==d['integrity']['restored_fingerprint']; assert d['cleanup']['restored_database_removed']"
      - name: Retain non-sensitive recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: database-recovery-evidence
          path: |
            recovery-report.json
            ${{ runner.temp }}/evoagent-dr/*.manifest.json
          if-no-files-found: warn
          retention-days: 14
      - name: Build the production image
        run: |
          docker build -t evoagent:ci .
          test "$(docker image inspect --format '{{.Config.User}}' evoagent:ci)" = evoagent
      - name: Run migrations from the production image
        run: |
          docker run --rm --network host \
            -e EVOAGENT_DATABASE_URL="${EVOAGENT_TEST_POSTGRES_URL}" \
            evoagent:ci python -m evoagent.migrate | python -c \
            "import json,sys; from evoagent.migrations import CURRENT_SCHEMA_VERSION; d=json.load(sys.stdin); assert d == {'backend':'postgresql','schema_version':CURRENT_SCHEMA_VERSION,'status':'migrated'}"
      - name: Run the real container verifier boundary tests
        env:
          EVOAGENT_TEST_CONTAINER_IMAGE: evoagent:ci
        run: |
          python -m pytest -q tests/test_container_integration.py \
            --junitxml=container-contracts.xml
          python -c "import xml.etree.ElementTree as ET; r=ET.parse('container-contracts.xml').getroot(); n=sum(int(x.attrib.get('skipped',0)) for x in r.iter('testsuite')); assert n == 0, f'{n} container contracts were skipped'"
      - name: Start the built image with PostgreSQL and Redis
        run: |
          docker run -d --name evoagent-full-stack --network host \
            --read-only --tmpfs /tmp:size=256m,mode=1777 \
            --cap-drop ALL --security-opt no-new-privileges \
            --health-interval 1s --health-start-period 1s \
            -e EVOAGENT_HOST=127.0.0.1 \
            -e EVOAGENT_PORT=18080 \
            -e EVOAGENT_AUTH_REQUIRED=false \
            -e EVOAGENT_DATABASE_URL="${EVOAGENT_TEST_POSTGRES_URL}" \
            -e EVOAGENT_REDIS_URL="${EVOAGENT_TEST_REDIS_URL}" \
            -e EVOAGENT_SKILLS_DIR=/app/skills \
            evoagent:ci
      - name: Prove readiness and end-to-end outbox delivery
        run: |
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:18080/ready > ready.json 2>/dev/null; then
              break
            fi
            if [ "$attempt" = 45 ]; then
              docker logs evoagent-full-stack
              exit 1
            fi
            sleep 1
          done
          for attempt in $(seq 1 10); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' evoagent-full-stack)" = healthy ]; then
              break
            fi
            if [ "$attempt" = 10 ]; then
              docker inspect -f '{{json .State.Health}}' evoagent-full-stack
              exit 1
            fi
            sleep 1
          done
          python -c "import json; from evoagent.migrations import CURRENT_SCHEMA_VERSION; d=json.load(open('ready.json')); q=d['checks']['queue']; assert d['status']=='ready'; assert d['queue_backend']=='redis-streams'; assert d['checks']['schema_version']==CURRENT_SCHEMA_VERSION; assert q['healthy'] and q['lease_heartbeat_running']"
          curl -fsS -X POST 'http://127.0.0.1:18080/v1/reviews?async=true' \
            -H 'Content-Type: application/json' \
            -d '{"repository":"ci/full-stack","pull_request":17,"diff":"diff --git a/app.py b/app.py\n--- a/app.py\n+++ b/app.py\n@@ -1 +1,2 @@\n+value = 1\n+print(value)"}' \
            > accepted.json
          task_id=$(python -c "import json; print(json.load(open('accepted.json'))['task_id'])")
          for attempt in $(seq 1 45); do
            curl -fsS "http://127.0.0.1:18080/v1/tasks/${task_id}" > task.json
            state=$(python -c "import json; print(json.load(open('task.json'))['state'])")
            if [ "$state" = SUCCESS ]; then
              exit 0
            fi
            if [ "$state" = FAILED ] || [ "$attempt" = 45 ]; then
              cat task.json
              docker logs evoagent-full-stack
              exit 1
            fi
            sleep 1
          done
      - name: Verify graceful container shutdown
        run: |
          docker stop --time 20 evoagent-full-stack
          test "$(docker inspect -f '{{.State.ExitCode}}' evoagent-full-stack)" = 0
      - name: Prove incomplete-task reconstruction into a fresh Redis DB
        env:
          EVOAGENT_DATABASE_URL: ${{ env.EVOAGENT_TEST_POSTGRES_URL }}
          EVOAGENT_REDIS_URL: redis://127.0.0.1:6379/1
        run: |
          recovery_task_id="ci-regional-recovery-$(python -c 'import uuid; print(uuid.uuid4().hex)')"
          python scripts/queue_recovery_smoke.py seed --task-id "$recovery_task_id"
          recovery_id=$(python -c "import uuid; print(uuid.uuid4())")
          python -m evoagent.recovery \
            --recovery-id "$recovery_id" \
            --confirm-database evoagent \
            --max-tasks 10000 > queue-recovery-plan.json
          plan_sha256=$(python -c "import json; print(json.load(open('queue-recovery-plan.json'))['plan']['plan_sha256'])")
          python -m evoagent.recovery \
            --recovery-id "$recovery_id" \
            --confirm-database evoagent \
            --max-tasks 10000 \
            --expect-plan-sha256 "$plan_sha256" \
            --apply > queue-recovery-report.json
          cat queue-recovery-report.json
          python -c "import json; d=json.load(open('queue-recovery-report.json')); assert d['status']=='pass'; assert d['redis_target_state']=='reserved'; assert d['staging']['staged']==d['plan']['recoverable']"
          python -m evoagent.recovery \
            --recovery-id "$recovery_id" \
            --confirm-database evoagent \
            --max-tasks 10000 \
            --expect-plan-sha256 "$plan_sha256" \
            --apply > queue-recovery-retry.json
          python -c "import json; d=json.load(open('queue-recovery-retry.json')); assert d['status']=='pass'; assert d['already_applied']; assert d['staging']['already_applied']"
          python scripts/queue_recovery_smoke.py verify \
            --task-id "$recovery_task_id" \
            --report queue-recovery-report.json
      - name: Retain queue recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: queue-recovery-evidence
          path: |
            queue-recovery-plan.json
            queue-recovery-report.json
            queue-recovery-retry.json
          if-no-files-found: warn
          retention-days: 14
      - name: Tear down
        if: always()
        run: docker rm -f evoagent-full-stack 2>/dev/null || true

